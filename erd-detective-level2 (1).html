/* ---------- Chen Notation renderer ---------- */
function shp(n){const{t,x,y}=n,s=esc(n.n||''),L=s.length;
 if(t=='E'){const w=Math.max(104,L*9+26);return`<rect x="${x-w/2}" y="${y-22}" width="${w}" height="44" fill="#e0f6fd" stroke="${C.E}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#04506a">${s}</text>`}
 if(t=='A')return`<ellipse cx="${x}" cy="${y}" rx="${Math.max(46,L*4.6+16)}" ry="22" fill="${n.k?'#fff4cf':'#e2f8ec'}" stroke="${n.k?C.K:C.A}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#0b4a2c"${n.k?' text-decoration="underline" font-weight="700"':''}>${s}</text>`;
 const w=Math.max(64,L*7.2+16);return`<polygon points="${x},${y-34} ${x+w},${y} ${x},${y+34} ${x-w},${y}" fill="#ffe1f4" stroke="${C.R}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#7c0c58">${s}</text>`}
function draw(N,Ed,sel){const g=i=>N.find(n=>n.id==i);let s='';
 Ed.forEach((e,i)=>{const a=g(e[0]),b=g(e[1]);if(!a||!b)return;
  s+=`<line data-e="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#6b66a8" stroke-width="2"/>`;
  const r=a.t=='R'?a:b.t=='R'?b:0;
  if(r&&r.c){const o=r==a?b:a,L=Ed.filter(q=>q.includes(r.id)).map(q=>q[0]==r.id?q[1]:q[0]),lb=r.c.split(':')[L.indexOf(o.id)];
   if(lb)s+=`<text x="${o.x+(r.x-o.x)*.4}" y="${o.y+(r.y-o.y)*.4-9}" text-anchor="middle" font-weight="800" fill="#1a1640" stroke="#fff" stroke-width="4" paint-order="stroke">${lb}</text>`}});
 N.forEach(n=>{s+=`<g data-id="${n.id}" style="cursor:grab">${n.id==sel?`<rect x="${n.x-75}" y="${n.y-38}" width="150" height="76" fill="none" stroke="#7a45ff" stroke-dasharray="5"/>`:''}${shp(n)}</g>`});return s}
const svgW=(N,Ed,w,h,lg)=>`<div class="svgw${lg?' lg':''}"><svg viewBox="0 0 ${w} ${h}" font-family="Lexend,Arial,sans-serif" font-size="13">${draw(N,Ed)}</svg></div>`;
function star(e,at){const w=Math.max(560,at.length*150),N=[{id:0,t:'E',x:w/2,y:215,n:e}],Ed=[];at.forEach((a,i)=>{const k=a.endsWith('*');N.push({id:i+1,t:'A',x:(i+.5)*w/at.length,y:i%2?105:45,n:k?a.slice(0,-1):a,k});Ed.push([0,i+1])});return svgW(N,Ed,w,260,w>600)}
const rel=(a,r,b,c)=>svgW([{id:1,t:'E',x:110,y:70,n:a},{id:2,t:'R',x:300,y:70,n:r,c},{id:3,t:'E',x:490,y:70,n:b}],[[1,2],[2,3]],600,140);
function lay(x){const N=[],Ed=[[1,3],[3,2]];let id=4;const e1={id:1,t:'E',x:300,y:310,n:x.ents[0].n},e2={id:2,t:'E',x:700,y:310,n:x.ents[1].n};N.push(e1,e2,{id:3,t:'R',x:500,y:310,n:x.rel,c:x.c});
 [e1,e2].forEach((e,i)=>{const at=x.ents[i].a,n=at.length,a0=i?-70:110,a1=i?70:250;at.forEach((a,j)=>{const th=(n==1?(a0+a1)/2:a0+(a1-a0)*j/(n-1))*Math.PI/180;N.push({id,t:'A',x:Math.round(e.x+190*Math.cos(th)),y:Math.round(e.y-190*Math.sin(th)),n:a,k:a==x.ents[i].k?1:0});Ed.push([id,e.id]);id++})});
 return{N,E:Ed,id}}
const full=x=>{const L=lay(x);return svgW(L.N,L.E,1000,620,1)};

P.A=(st=0)=>{const x=EX[0],h=(c,t)=>`<span class="hl ${c}">${t}</span>`,

 const DL=['Read the scenario twice and mark every clue. The highlights show what to look for.','Entities are the things the organisation keeps records of.','Attributes are the facts stored about each entity, and only facts the scenario states.','A key is the one attribute that is unique for every record and never empty.','Look for “one” and “many” in the sentences. They decide the cardinality.','That is the complete ERD. Now work through the five exercises yourself.'];
 const T=[
 ['Step 1: Read the scenario carefully','Underline what the scenario actually says. Only use information that is stated.',`<p class=scn>A university manages its ${h('he','laboratories')} and the ${h('he','equipment')} kept in them. Each laboratory has a ${h('ha','lab code')}, ${h('ha','lab name')} and ${h('ha','location')}. Each equipment has an ${h('ha','equipment ID')}, ${h('ha','equipment name')}, ${h('ha','brand')} and ${h('ha','purchase date')}. <span class=hc>Each laboratory ${h('hr','contains')} many equipment items</span>, and <span class=hc>every equipment item is placed in one laboratory</span>.</p>${key}`],

let streak=0;
function seq(k,title,items,qf){let i=0,sc=0;const m=$('#main');
 const step=()=>{if(i>=items.length){fin(k);const p=sc/items.length;m.innerHTML=`<div class=card><div class=resulthead>${dex(p>=.7?'joy':'think',84)}<div><h2>${title}: complete</h2><p class=big>${Math.round(sc*10)/10} / ${items.length} ${pips(p)}</p><p>${p>=.8?'Strong result. You have this part covered.':'Good progress. Retry to improve your score.'}</p></div></div><button class=b onclick="go('${k}')">Try again</button><button class=b2 onclick="go('home')">Dashboard</button></div>`;return}
  m.innerHTML=`<h2>${title}</h2><div class=bar><i style="width:${i/items.length*100}%"></i></div><p class=mu>Scenario ${i+1}/${items.length} · Score ${Math.round(sc*10)/10}</p><div class=card id=q></div><div id=fb></div>`;
  qf(items[i],$('#q'),(ok,tot,html)=>{sc+=ok/tot;S.ok+=ok;S.tot+=tot;save();const full=ok==tot;streak=full?streak+1:0;
   $('#fb').innerHTML=`<div class="card fb ${full?'good':'bad'}"><div class=verdict>${dex(full?'joy':ok?'think':'oops',46,1)}<b>${full?'Correct':ok?'Partly correct':'Not quite'}</b>${streak>1?`<span class=streak>${streak} correct in a row</span>`:''}</div><p>${html}</p></div><button class=b id=nx>${i+1<items.length?'Next':'See score'}</button>`;$('#nx').onclick=()=>{i++;step()};$('#nx').focus()})};step()}

<div class=card><h3>What Level 2 is based on</h3><p>All scenarios, attributes, keys, relationships and cardinalities come from the <i>DAT20103 Exercise: Entity-Relationship Model (Chen Notation)</i> worksheet and its answer scheme. Students practise the same five exercises in the app, and the app checks their ERDs against the scheme.</p></div>
<div class=card><h3>Suggested session (about 90 minutes)</h3><p>1) <b>Learn the Method</b> (10 min): walk through Exercise 1 together. 2) <b>Entities & Attributes</b> (15 min). 3) <b>Key Attributes</b> (10 min). 4) <b>Relationships & Cardinality</b> (15 min). 5) <b>Draw 3 ERDs</b> (25 min): students may export each diagram as PNG. 6) <b>Challenge Quiz</b> (10 min) as a formative assessment.</p></div>
<div class=card><h3>Cardinality convention</h3><p>Only three cardinalities are used: <b>1:1</b>, <b>1:M</b> (the “one” side is always written first) and <b>M:N</b> for many-to-many. M:1, N:M and M:M are never used or accepted as notation. In the ERD builder students choose the type, and for 1:M they choose which entity is the “one” side.</p></div>
<div class=card><h3>Marking logic</h3><p>B: 2 marks for entities, plus 1 mark per correct attribute ticked; each wrong tick removes 1 mark (never below 0). C: 1 mark per correct key (2 per exercise). D: 3 parts per exercise (relationship name, one/many for each side), 1/3 each. E: an exercise counts when the ERD has exactly the stated entities, attributes, key, relationship and cardinality. Accepted spelling variants include “matric_number”, “email” and “quantity”. The sample answer unlocks after 3 unsuccessful checks and is recorded as “Sample answers viewed”. F: 1 mark per question (matching needs every pair correct). Levels: ≥90% ERM Expert, 70–89% ERM Explorer, <70% Keep Practising.</p></div>
<div class=card><h3>Answer scheme used by the app</h3><div style="overflow-x:auto"><table><tr><th>Ex<th>Entity: attributes (key underlined)<th>Relationship<th>Cardinality</tr>${EX.map(x=>`<tr><td>${x.id}<td>${x.ents.map(e=>`<b>${e.n}</b>: ${e.a.map(a=>a==e.k?`<u>${a}</u>`:a).join(', ')}`).join('<br>')}<td>${x.rel}<td>${x.ents[0].n} : ${x.ents[1].n} = ${x.c}${x.id==5?' (M:N over time)':''}</tr>`).join('')}</table></div></div>
<div class=card><h3>Student list (Google Sheet)</h3><p>Students register with name, matric number and section. When every module (including all three ERDs) is complete, one row is sent to the “Students L2” sheet; Level 1 keeps its own “Students” sheet. Use the updated Code.gs, deploy it as a new version, then paste the /exec URL into SHEET_URL at the top of the script. The Leaderboard reads the same sheet.</p></div>
<div class=card><h3>Privacy & offline use</h3><p>Progress and drawings are kept in the student’s browser local storage under Level 2 keys, so Level 1 progress is not affected. Name, matric number and section are sent only after all modules are complete; no other personal data is requested. The only extra item stored is the avatar the student picked (one of eight cyberpunk characters), which appears on the Leaderboard.</p></div>`};
